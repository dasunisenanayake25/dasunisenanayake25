<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <style>
    .line { transform-box: fill-box; transform-origin: left center; animation: type 4s ease-in-out infinite; }
    .l2 { animation-delay: .4s; } .l3 { animation-delay: .8s; } .l4 { animation-delay: 1.2s; }
    .l5 { animation-delay: 1.6s; } .l6 { animation-delay: 2s; }
    @keyframes type { 0% { transform: scaleX(0); } 25%, 85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .handL { animation: tapL .35s ease-in-out infinite alternate; }
    .handR { animation: tapR .35s ease-in-out infinite alternate; animation-delay: .17s; }
    @keyframes tapL { to { transform: translateY(-3px); } }
    @keyframes tapR { to { transform: translateY(-3px); } }
    .gear { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
    .gear2 { animation-direction: reverse; animation-duration: 4s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bubble { animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    .head { transform-box: fill-box; transform-origin: bottom center; animation: nod 4s ease-in-out infinite; }
    @keyframes nod { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-2deg); } }
    .plant { transform-box: fill-box; transform-origin: bottom center; animation: sway 5s ease-in-out infinite; }
    @keyframes sway { 50% { transform: rotate(4deg); } }
    .bars rect { transform-box: fill-box; transform-origin: bottom; animation: grow 2.4s ease-in-out infinite alternate; }
    .bars rect:nth-child(2) { animation-delay: .3s; } .bars rect:nth-child(3) { animation-delay: .6s; } .bars rect:nth-child(4) { animation-delay: .9s; }
    @keyframes grow { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
  </style>

  <!-- floor shadow -->
  <ellipse cx="240" cy="330" rx="210" ry="14" fill="#5C4BC4" opacity=".25"/>

  <!-- floating code bubble -->
  <g class="bubble">
    <rect x="300" y="18" width="150" height="70" rx="12" fill="#1E2235" stroke="#9C27B0" stroke-width="2"/>
    <text x="316" y="47" font-family="Consolas, monospace" font-size="16" fill="#C792EA">&lt;/&gt;</text>
    <text x="350" y="47" font-family="Consolas, monospace" font-size="13" fill="#00BFA5">code();</text>
    <g class="bars">
      <rect x="318" y="58" width="12" height="20" rx="2" fill="#9C27B0"/>
      <rect x="336" y="58" width="12" height="20" rx="2" fill="#5C4BC4"/>
      <rect x="354" y="58" width="12" height="20" rx="2" fill="#36BCF7"/>
      <rect x="372" y="58" width="12" height="20" rx="2" fill="#00BFA5"/>
    </g>
    <path d="M330 88 l10 14 l6 -14z" fill="#1E2235" stroke="#9C27B0" stroke-width="2" stroke-linejoin="round"/>
    <rect x="331" y="85" width="14" height="5" fill="#1E2235"/>
  </g>

  <!-- gears -->
  <g class="gear" fill="#36BCF7">
    <path d="M60 40 l5 0 l1 6 l5 2 l5 -4 l4 4 l-4 5 l2 5 l6 1 l0 5 l-6 1 l-2 5 l4 5 l-4 4 l-5 -4 l-5 2 l-1 6 l-5 0 l-1 -6 l-5 -2 l-5 4 l-4 -4 l4 -5 l-2 -5 l-6 -1 l0 -5 l6 -1 l2 -5 l-4 -5 l4 -4 l5 4 l5 -2z"/>
    <circle cx="62.5" cy="62.5" r="7" fill="#0d1117"/>
  </g>
  <g class="gear gear2" fill="#00BFA5">
    <path d="M95 82 l4 0 l1 4 l3 1 l3 -3 l3 3 l-3 3 l1 3 l4 1 l0 4 l-4 1 l-1 3 l3 3 l-3 3 l-3 -3 l-3 1 l-1 4 l-4 0 l-1 -4 l-3 -1 l-3 3 l-3 -3 l3 -3 l-1 -3 l-4 -1 l0 -4 l4 -1 l1 -3 l-3 -3 l3 -3 l3 3 l3 -1z"/>
    <circle cx="97" cy="99" r="4.5" fill="#0d1117"/>
  </g>

  <!-- plant -->
  <g class="plant">
    <path d="M42 262 q-14 -30 4 -52 q4 26 -4 52z" fill="#00BFA5"/>
    <path d="M46 262 q16 -26 40 -30 q-14 22 -40 30z" fill="#1DA88E"/>
    <path d="M44 262 q-26 -12 -30 -36 q22 8 30 36z" fill="#14967E"/>
  </g>
  <path d="M28 260 h36 l-5 28 h-26z" fill="#9C27B0"/>

  <!-- desk -->
  <rect x="20" y="288" width="440" height="10" rx="3" fill="#3A3F5C"/>
  <rect x="44" y="298" width="8" height="34" fill="#2A2E45"/>
  <rect x="428" y="298" width="8" height="34" fill="#2A2E45"/>

  <!-- monitor -->
  <rect x="96" y="110" width="230" height="150" rx="10" fill="#2A2E45"/>
  <rect x="106" y="120" width="210" height="130" rx="4" fill="#0F1222"/>
  <circle cx="118" cy="130" r="3" fill="#FF5F56"/><circle cx="128" cy="130" r="3" fill="#FFBD2E"/><circle cx="138" cy="130" r="3" fill="#27C93F"/>
  <rect class="line l1" x="118" y="144" width="90" height="7" rx="3" fill="#C792EA"/>
  <rect class="line l2" x="130" y="160" width="130" height="7" rx="3" fill="#36BCF7"/>
  <rect class="line l3" x="130" y="176" width="70" height="7" rx="3" fill="#00BFA5"/>
  <rect class="line l4" x="142" y="192" width="110" height="7" rx="3" fill="#FFCB6B"/>
  <rect class="line l5" x="130" y="208" width="150" height="7" rx="3" fill="#36BCF7"/>
  <rect class="line l6" x="118" y="224" width="60" height="7" rx="3" fill="#C792EA"/>
  <rect class="cursor" x="184" y="222" width="3" height="11" fill="#ffffff"/>
  <rect x="198" y="260" width="26" height="22" fill="#2A2E45"/>
  <rect x="178" y="280" width="66" height="8" rx="3" fill="#3A3F5C"/>

  <!-- coffee mug -->
  <rect x="62" y="266" width="22" height="22" rx="3" fill="#36BCF7"/>
  <path d="M84 271 q9 0 9 6 q0 6 -9 6" fill="none" stroke="#36BCF7" stroke-width="3"/>

  <!-- chair back -->
  <rect x="352" y="168" width="70" height="120" rx="18" fill="#5C4BC4"/>

  <!-- person (seen from behind/side) -->
  <!-- hair back (behind body) -->
  <path d="M378 170 q30 10 26 50 q-10 4 -20 0z" fill="#1A1423"/>
  <!-- body -->
  <path d="M330 300 q-6 -70 26 -100 q34 -16 52 14 q12 30 6 86z" fill="#9C27B0"/>
  <path d="M356 200 q16 10 30 0" fill="none" stroke="#7B1FA2" stroke-width="3"/>
  <!-- head -->
  <g class="head">
    <rect x="364" y="182" width="14" height="18" fill="#C68B6E"/>
    <circle cx="372" cy="164" r="24" fill="#C68B6E"/>
    <path d="M346 166 q-2 -34 28 -36 q28 2 24 34 q-6 -14 -22 -18 q-18 4 -30 20z" fill="#1A1423"/>
    <circle cx="392" cy="140" r="11" fill="#1A1423"/>
    <!-- headset -->
    <path d="M350 158 q2 -32 24 -32" fill="none" stroke="#00BFA5" stroke-width="4"/>
    <rect x="344" y="156" width="10" height="16" rx="4" fill="#00BFA5"/>
  </g>
  <!-- arms -->
  <path d="M346 226 q-30 22 -70 44" fill="none" stroke="#9C27B0" stroke-width="14" stroke-linecap="round"/>
  <!-- keyboard -->
  <rect x="226" y="280" width="96" height="8" rx="2" fill="#4A4F70"/>
  <!-- hands -->
  <ellipse class="handL" cx="268" cy="276" rx="9" ry="5" fill="#C68B6E"/>
  <ellipse class="handR" cx="292" cy="278" rx="9" ry="5" fill="#C68B6E"/>
  <path d="M352 236 q-24 26 -56 40" fill="none" stroke="#8A1FA0" stroke-width="13" stroke-linecap="round"/>
</svg>
